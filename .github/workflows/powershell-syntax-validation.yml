name: PowerShell syntax validation

on:
  pull_request:
    paths:
      - "Win10/**/*.ps1"
      - "Win11/**/*.ps1"
      - ".github/workflows/powershell-syntax-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    name: Parse all Windows PowerShell scripts
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptFiles = @(
              Get-ChildItem -Path 'Win10','Win11' -Filter '*.ps1' -Recurse -File |
                  Sort-Object -Property FullName
          )

          if ($scriptFiles.Count -eq 0) {
              throw 'No PowerShell scripts were found under Win10/ or Win11/.'
          }

          foreach ($file in $scriptFiles) {
              $tokens = $null
              $parseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName,
                  [ref]$tokens,
                  [ref]$parseErrors
              )

              if ($parseErrors.Count -gt 0) {
                  $details = $parseErrors | ForEach-Object {
                      '{0}:{1}: {2}' -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message
                  }
                  throw ("PowerShell syntax errors in {0}: {1}" -f $file.FullName, ($details -join '; '))
              }

              Write-Host ("PowerShell syntax OK: {0}" -f $file.FullName)
          }

          Write-Host ("Validated {0} PowerShell script(s)." -f $scriptFiles.Count)
